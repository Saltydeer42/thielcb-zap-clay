name: Send Peter Thiel deals to Clay

on:
  schedule:
    # Every Monday at 9:00 AM Eastern (14:00 UTC) – adjust to your liking
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  send-deals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fund_tracker/requirements.txt

      - name: Run pipeline (past 7 days)
        env:
          CRUNCHBASE_API_KEY: ${{ secrets.CRUNCHBASE_API_KEY }}
          VC_FIRM_NAMES: "Peter Thiel"
          ZAPIER_WEBHOOK_URL: ${{ secrets.CLAY_WEBHOOK_URL }}
        run: python -m fund_tracker.cli --days-back 7
